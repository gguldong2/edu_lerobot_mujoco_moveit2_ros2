# Drop-in replacement for so101_project_moveit_config/config/moveit_controllers.yaml
#
# Differences from the upstream file and why:
#   1. upstream runs its controllers inside the /follower namespace
#      (follower/arm_trajectory_controller) - this project runs a single arm in the
#      root namespace, so the prefix is removed.
#   2. upstream drives the gripper with ParallelGripperCommand / gripper_cmd. This
#      project uses a 1-joint JointTrajectoryController instead: one controller type
#      for both groups, and it also works on Humble where the parallel gripper
#      controller is not packaged.
#
# The controller names and action namespaces here MUST match config/controllers.yaml.
trajectory_execution:
  allowed_execution_duration_scaling: 2.5
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.05          # raise to 0.1 on real servos with backlash
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - gripper
